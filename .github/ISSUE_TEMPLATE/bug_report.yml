name: Bug report
description: Something went wrong while running fcx or the quick capture.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start:** never paste a session token, any DM, bookmark or draft text, export files, or `fcx find` output. Replace your home folder path with `~`.
        `fcx verify` output is safe to paste, because it holds statuses and counts only. Security problems go through SECURITY.md, not an issue.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no session token, no DM, bookmark or draft text, and no export files.
          required: true
  - type: dropdown
    id: tool
    attributes:
      label: What were you running?
      options:
        - fcx export (public data only)
        - fcx export --private
        - fcx auth-check
        - fcx verify
        - fcx find
        - Quick capture (scripts/quick-capture.mjs)
        - Other
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      description: You can replace your FID with YOUR_FID.
      placeholder: node bin/fcx.js export --fid YOUR_FID --private
    validations:
      required: true
  - type: input
    id: exit-code
    attributes:
      label: Exit code
      description: Run `echo $?` straight after the command.
      placeholder: "1"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The last lines the command printed, plus the whole `fcx verify` output if you ran it. Check it for private text before posting.
      render: text
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v24.13.0
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: fcx commit
      description: Output of `git rev-parse --short HEAD`, run in the fcx folder.
    validations:
      required: true
